    <!--
      Meta Pixel. Vive acá y NO en un tag de HTML personalizado de GTM.
      Motivo: la CSP de este sitio no lleva 'unsafe-inline' en script-src (cada
      script inline entra por su hash, ver scripts/csp-hashes.mjs). GTM inyecta
      los tags de HTML personalizado como código inline en tiempo de ejecución,
      que ningún hash puede autorizar —y 'strict-dynamic' tampoco, porque GTM no
      los inserta de una forma que propague la confianza—, así que ahí el píxel
      quedaba bloqueado. Declarado en el HTML, el build lo hashea y funciona.
      Contrapartida: cambiarlo exige un deploy, ya no basta con editar GTM.
    -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
        }
        if (!f._fbq) f._fbq = n
        n.push = n
        n.loaded = !0
        n.version = '2.0'
        n.queue = []
        t = b.createElement(e)
        t.async = !0
        t.src = v
        s = b.getElementsByTagName(e)[0]
        s.parentNode.insertBefore(t, s)
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
      fbq('init', '1524660162308441')
      fbq('track', 'PageView')
    </script>

    <!-- Google Fonts - carga NO bloqueante (preload + swap) para mejorar FCP/LCP -->
    <link
      id="fuentes-google"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
    />
    <!--
      El cambio de preload a stylesheet iba en un atributo onload="…". La CSP
      controla los manejadores inline con `script-src-attr`, y un hash no puede
      autorizarlos (haría falta 'unsafe-hashes'). Como script inline sí entra por
      su hash, que el build calcula solo.
    -->
    <script>
      (function () {
        var l = document.getElementById('fuentes-google')
        if (!l) return
        var activar = function () {
          l.rel = 'stylesheet'
        }
        // Si el preload ya terminó, `load` no vuelve a dispararse.
        if (l.sheet) activar()
        else l.addEventListener('load', activar, { once: true })
      })()
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
